# Fork: every push to main (yours, or an upstream sync merged by
# fork-upstream-sync.yml) is tested and published as a new image:
#
#   ghcr.io/<owner>/dispatcharr:latest
#   ghcr.io/<owner>/dispatcharr:<version>-custom.<run>   e.g. 0.33.0-custom.12
#   ghcr.io/<owner>/dispatcharr:sha-<commit>
name: "Fork: test and publish image"

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: fork-deploy
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository != 'Dispatcharr/Dispatcharr'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dispatcharr
          POSTGRES_USER: dispatch
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dispatch -d dispatcharr" --health-interval 5s
          --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: .github/fork/install-python-deps.sh

      - name: Prepare /data
        # Like the app container, several tests read and write under /data.
        run: sudo mkdir -p /data && sudo chown "$(id -u):$(id -g)" /data

      - name: Verify (tests + build)
        run: .github/fork/verify.sh all

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Image name and version
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          version="$(python3 -c "import re;print(re.search(r\"__version__ = '([^']+)'\", open('version.py').read()).group(1))")"
          echo "image=ghcr.io/${owner}/dispatcharr" >> "$GITHUB_OUTPUT"
          echo "version=${version}-custom.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64
          # The heavy base image (Python deps, FFmpeg) comes from upstream;
          # only the app layer is rebuilt here.
          build-args: |
            REPO_OWNER=dispatcharr
            REPO_NAME=dispatcharr
            BASE_TAG=base
            TIMESTAMP=${{ steps.meta.outputs.timestamp }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Published ${{ steps.meta.outputs.version }}"
            echo '```'
            echo "${{ steps.meta.outputs.image }}:latest"
            echo "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
